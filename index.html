<!DOCTYPE html>

    <meta charset="utf-8" />

    <title>GameGen AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              cyber: {
                900: '#0f172a',
                800: '#1e293b',
                700: '#334155',
                cyan: '#06b6d4',
                purple: '#8b5cf6',
                pink: '#ec4899'
              }
            },
            keyframes: {
              glow: {
                '0%, 100%': { borderColor: '#334155', boxShadow: '0 0 0px transparent' },
                '50%': { borderColor: '#06b6d4', boxShadow: '0 0 15px rgba(6, 182, 212, 0.3)' }
              }
            },
            animation: {
              'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
              'spin-slow': 'spin 3s linear infinite',
              'border-glow': 'glow 3s ease-in-out infinite',
            }
          }
        }
      }
    </script>
    <style>
      body {
        background-color: #0f172a;
        color: #f8fafc;
        font-family: 'Segoe UI', system-ui, sans-serif;
      }
      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #1e293b; 
      }
      ::-webkit-scrollbar-thumb {
        background: #334155; 
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #475569; 
      }
    </style>
